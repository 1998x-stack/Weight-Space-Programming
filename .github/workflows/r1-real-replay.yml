name: R1 official p50c checkpoint SHA replay

on:
  pull_request:
    paths:
      - ".github/workflows/r1-real-replay.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-bf16-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU-only dependencies
        run: python -m pip install "numpy>=1.26,<3" "huggingface_hub>=0.35,<2"
      - name: Fetch pinned official Qwen model snapshot (approximately 1.75 GB)
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id="Qwen/Qwen3.5-0.8B",
              revision="2fc06364715b967f1860aea9cf38778875588b17",
              local_dir="/tmp/wsp-r1/base",
              allow_patterns=["*.safetensors", "*.index.json", "*.json", "*.jinja", "*.txt", "*.model"],
          )
          PY
      - name: Download exact upstream public p50c patch
        run: |
          mkdir -p /tmp/wsp-r1/edit
          curl --fail --location --silent --show-error --retry 3 https://raw.githubusercontent.com/RikiyaT/lm_understand-logs/main/exp8_math/runs/p50c/edit/manifest.json -o /tmp/wsp-r1/edit/manifest.json
          curl --fail --location --silent --show-error --retry 3 https://raw.githubusercontent.com/RikiyaT/lm_understand-logs/main/exp8_math/runs/p50c/edit/edit.npz -o /tmp/wsp-r1/edit/edit.npz
      - name: Rebuild and verify official BF16 tensor SHA256
        run: |
          python scripts/r1.py replay --base /tmp/wsp-r1/base --edit /tmp/wsp-r1/edit --out /tmp/wsp-r1/edited | tee /tmp/wsp-r1/r1_replay_stdout.txt
          python - <<'PY'
          import json
          a=json.load(open('/tmp/wsp-r1/edited/wsp_r1_audit.json'))
          assert a['strict_p50c'] and a['changed_tensors']==2 and a['changed_entries']==130188
          print('Published p50c tensor hashes verified. No benchmark was run.')
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: r1-official-sha-audit-only
          path: |
            /tmp/wsp-r1/edited/wsp_r1_audit.json
            /tmp/wsp-r1/r1_replay_stdout.txt
          retention-days: 14
