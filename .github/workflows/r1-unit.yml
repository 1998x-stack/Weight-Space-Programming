name: R1 CPU unit tests

on:
  push:
    paths:
      - "src/wsp/**"
      - "scripts/r1*.py"
      - "tests/unit/**"
      - ".github/workflows/r1-unit.yml"
  pull_request:
    paths:
      - "src/wsp/**"
      - "scripts/r1*.py"
      - "tests/unit/**"
      - ".github/workflows/r1-unit.yml"

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "numpy>=1.26,<3" "pytest>=8,<10"
      - run: python -m pytest -q tests/unit/test_r1_replay.py tests/unit/test_r1_pairing.py tests/unit/test_r1_math500.py
