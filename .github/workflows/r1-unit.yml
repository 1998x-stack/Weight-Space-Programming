name: R1/R2 CPU unit tests

on:
  push:
    paths:
      - "src/wsp/**"
      - "scripts/r1*.py"
      - "scripts/r2*.py"
      - "tests/unit/**"
      - ".github/workflows/r1-unit.yml"
      - "pyproject.toml"
  pull_request:
    paths:
      - "src/wsp/**"
      - "scripts/r1*.py"
      - "scripts/r2*.py"
      - "tests/unit/**"
      - ".github/workflows/r1-unit.yml"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/unit
      - run: python -m compileall -q src/wsp scripts

  synthetic-torch-hook-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch without CUDA dependencies
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/unit/test_r2b_torch.py
