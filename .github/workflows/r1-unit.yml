name: R1/R2 CPU unit tests

on:
  push:
    paths:
      - "src/wsp/**"
      - "scripts/r1*.py"
      - "scripts/r2*.py"
      - "tests/unit/**"
      - ".github/workflows/r1-unit.yml"
  pull_request:
    paths:
      - "src/wsp/**"
      - "scripts/r1*.py"
      - "scripts/r2*.py"
      - "tests/unit/**"
      - ".github/workflows/r1-unit.yml"

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/unit
      - run: python -m compileall -q src/wsp scripts/r1.py scripts/r2_offline.py
