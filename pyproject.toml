[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weight-space-programming-lab"
version = "0.1.0"
description = "Weight-Space Programming research docs and R1 checkpoint reproduction utilities"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "1998x-stack contributors" }]
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
# GPU versions are validated at execution time; see r1-implementation.md.
# Install vllm, transformers, datasets and math-verify==0.9.0 separately.

# No project license selected at v0.1; do not infer rights from the upstream study.

[tool.setuptools.packages.find]
where = ["src"]
