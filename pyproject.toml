[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weight-space-programming-lab"
version = "0.2.0"
description = "Weight-Space Programming evidence-led research and Qwen checkpoint/probe utilities"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "1998x-stack contributors" }]
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
r2-probe = ["torch>=2.6,<3", "transformers>=5.0,<6", "huggingface-hub>=0.35,<2"]
# GPU/CUDA builds and compatible Transformers need validation on execution device.
# math-verify==0.9.0 and vLLM are separate R1 GPU benchmark dependencies.

# No project license selected: do not infer repository code rights from upstream study.

[tool.setuptools.packages.find]
where = ["src"]
